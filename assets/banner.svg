<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="900" height="240" role="img" aria-label="dsh-plugin-zcode-import banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4d6bfe"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="zcode" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#ef4444"/>
    </linearGradient>
  </defs>

  <rect width="900" height="240" rx="18" fill="url(#bg)"/>
  <rect x="0" y="0" width="900" height="4" rx="2" fill="url(#accent)"/>

  <!-- left: ZCode archive -->
  <g transform="translate(70 60)">
    <rect x="0" y="0" width="132" height="120" rx="12" fill="#1f2937" stroke="#374151" stroke-width="2"/>
    <rect x="0" y="0" width="132" height="28" rx="12" fill="url(#zcode)" opacity="0.85"/>
    <text x="66" y="20" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0d1117" text-anchor="middle">ZCode</text>
    <g fill="#4b5563">
      <rect x="16" y="44" width="100" height="9" rx="4.5"/>
      <rect x="16" y="62" width="76" height="9" rx="4.5"/>
      <rect x="16" y="80" width="90" height="9" rx="4.5"/>
      <rect x="16" y="98" width="58" height="9" rx="4.5"/>
    </g>
  </g>

  <!-- arrow -->
  <g transform="translate(240 100)">
    <path d="M0 20 H96" stroke="url(#accent)" stroke-width="6" stroke-linecap="round"/>
    <path d="M86 6 L110 20 L86 34 Z" fill="#6d7cff"/>
    <text x="52" y="-8" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#8b93a7" text-anchor="middle">import</text>
  </g>

  <!-- right: DSH sessions -->
  <g transform="translate(392 60)">
    <rect x="0" y="0" width="200" height="120" rx="12" fill="#1f2937" stroke="#374151" stroke-width="2"/>
    <rect x="0" y="0" width="200" height="28" rx="12" fill="url(#accent)" opacity="0.9"/>
    <text x="100" y="20" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0b1020" text-anchor="middle">DeepSeek Harness</text>
    <g>
      <rect x="14" y="42" width="172" height="20" rx="6" fill="#111827" stroke="#2b3444"/>
      <circle cx="26" cy="52" r="4" fill="#22c55e"/>
      <rect x="38" y="48" width="96" height="8" rx="4" fill="#4b5563"/>

      <rect x="14" y="68" width="172" height="20" rx="6" fill="#111827" stroke="#2b3444"/>
      <circle cx="26" cy="78" r="4" fill="#22c55e"/>
      <rect x="38" y="74" width="120" height="8" rx="4" fill="#4b5563"/>

      <rect x="14" y="94" width="172" height="20" rx="6" fill="#111827" stroke="#2b3444"/>
      <circle cx="26" cy="104" r="4" fill="#22c55e"/>
      <rect x="38" y="100" width="72" height="8" rx="4" fill="#4b5563"/>
    </g>
  </g>

  <text x="640" y="112" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="27" font-weight="700" fill="#e6edf3">dsh-plugin</text>
  <text x="640" y="145" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="27" font-weight="700" fill="url(#accent)">-zcode-import</text>
  <text x="640" y="172" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#8b93a7">ZCode 会话导入 · 按工作区浏览与勾选</text>
</svg>
